<div class="card h-100">

  <img
    [src]="'assets/images/' + producto.imagen"
    class="card-img-top"
    [alt]="producto.nombre">

  <div class="card-body">

    <h5>{{ producto.nombre }}</h5>

    <p>{{ producto.descripcion }}</p>

    <p>${{ producto.precio }}</p>

    <button
      class="btn btn-warning"
      (click)="seleccionar()">

      Ver producto

    </button>

  </div>

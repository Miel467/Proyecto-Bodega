

@if(productos.length > 0){

<div class="row">

@for (producto of productosFiltrados; track producto.id) {
 

<div class="col-md-4 mb-4">

    <app-producto-card

        [producto]="producto">

    </app-producto-card>

</div>

}

</div>

}@else{

<p>No hay productos disponibles.</p>

}
